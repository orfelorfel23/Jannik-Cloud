services:
  dashboard:
    image: caddy:alpine
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:80"
    volumes:
      - ./www:/usr/share/caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
