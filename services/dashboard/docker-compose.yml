services:
  dashboard:
    image: caddy:alpine
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./www:/usr/share/caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
