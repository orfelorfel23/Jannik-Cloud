services:
  checkbox-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: checkbox_mssql
    restart: unless-stopped
    ports:
      - "7224:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/checkbox/data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null; fi"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
