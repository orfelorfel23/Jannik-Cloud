services:
  quizalarm-stat:
    image: git.orfel.de/jannik/quizalarm-stat:latest
    container_name: quizalarm-stat
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7850/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
