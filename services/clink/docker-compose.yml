services:
  clink:
    build:
      context: .
      dockerfile: Dockerfile
    image: clink:latest
    container_name: clink
    restart: unless-stopped
    ports:
      - "127.0.0.1:5234:8080"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/clink:/srv/clink
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
