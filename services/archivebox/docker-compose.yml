services:
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:5797"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/archivebox:/data
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=*
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 5 --connect-timeout 2 -H 'Host: admin.archivebox.localhost:5797' http://127.0.0.1:5797/health/ | grep -q 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
