services:
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/archivebox:/data
    env_file:
      - .env
    environment:
      - ALLOWED_HOSTS=*
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
