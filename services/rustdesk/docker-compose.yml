services:
  rustdesk:
    image: rustdesk/rustdesk-server-s6:latest
    container_name: rustdesk
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:21114"
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    environment:
      - RELAY=orfel.de
      - ENCRYPTED_ONLY=0
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/rustdesk:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
