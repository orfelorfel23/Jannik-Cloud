services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:3463:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - /mnt/Jannik-Cloud-Volume-01/searxng:/etc/searxng/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
