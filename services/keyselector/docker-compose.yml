services:
  keyselector:
    image: git.orfel.de/jannik/keyselector:latest
    container_name: keyselector
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      PORT: 3000
      ACRCLOUD_HOST: ${ACRCLOUD_HOST:-}
      ACRCLOUD_ACCESS_KEY: ${ACRCLOUD_ACCESS_KEY:-}
      ACRCLOUD_ACCESS_SECRET: ${ACRCLOUD_ACCESS_SECRET:-}
      AUDD_API_TOKEN: ${AUDD_API_TOKEN:-}
      GETSONGBPM_API_KEY: ${GETSONGBPM_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      DATABASE_URL: postgresql://keyselector:${DB_PW}@postgres:5432/keyselector
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
