services:
  keyselector:
    build:
      context: .
      dockerfile: build.Dockerfile
      args:
        REPO_URL: https://git.orfel.de/Jannik/KeySelector.git
        BRANCH: main
    image: keyselector:latest
    pull_policy: build
    container_name: keyselector
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY}
      GETSONGBPM_API_KEY: ${GETSONGBPM_API_KEY}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET}
      NTFY_URL: ${NTFY_URL}
      DATABASE_URL: postgresql://keyselector:${DB_PW}@postgres:5432/keyselector
      REDIS_URL: redis://redis:6379
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
