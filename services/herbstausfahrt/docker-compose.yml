services:
  herbstausfahrt:
    image: nginx:alpine
    container_name: herbstausfahrt
    restart: unless-stopped
    ports:
      - "127.0.0.1:3850:80"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/herbstausfahrt/content:/usr/share/nginx/html:ro
      - /mnt/Jannik-Cloud-Volume-01/herbstausfahrt/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
