services:
  herbstausfahrt:
    image: git.orfel.de/jannik/herbstausfahrt:latest
    pull_policy: always
    container_name: herbstausfahrt
    restart: unless-stopped
    ports:
      - "127.0.0.1:3850:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
