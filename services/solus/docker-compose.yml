services:
  solus:
    image: git.orfel.de/jannik/solus:latest
    container_name: solus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8787
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - solus_uploads:/app/uploads
    networks:
      - jannik-cloud-net

volumes:
  solus_uploads:

networks:
  jannik-cloud-net:
    external: true
