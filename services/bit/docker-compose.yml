services:
  bit:
    image: sjdonado/bit:latest
    container_name: bit
    restart: unless-stopped
    environment:
      - ADMIN_NAME=admin
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - APP_URL=https://bit.orfel.de
      - ENV=production
    ports:
      - "127.0.0.1:5233:4000"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/bit:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
