services:
  deezer:
    image: kmille2/deezer-downloader:latest
    container_name: deezer
    restart: unless-stopped
    ports:
      - "127.0.0.1:673:5000"
    environment:
      DEEZER_COOKIE_ARL: ${DEEZER_ARL}
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/deezer/downloads:/mnt/deezer-downloader
      - /mnt/Jannik-Cloud-Volume-01/deezer/config:/config
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
