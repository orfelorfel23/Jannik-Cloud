services:
  tokenwatch:
    image: git.orfel.de/jannik/tokenwatch:latest
    container_name: tokenwatch
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:3000"
    env_file:
      - .env
    environment:
      # TokenWatch liest DATABASE_URL und NTFY_URL aus der .env
      NODE_ENV: production
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
