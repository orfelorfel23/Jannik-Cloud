services:
  tokenwatch:
    image: git.orfel.de/jannik/tokenwatch:latest
    container_name: tokenwatch
    restart: unless-stopped
    ports:
      - "127.0.0.1:3500:3000"
    env_file:
      - .env
    environment:
      # TokenWatch liest DB_USER, DB_PASSWORD, etc. und NTFY_URL aus der .env
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
