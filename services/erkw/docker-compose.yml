services:
  erkw:
    image: git.orfel.de/jannik/erkw:latest # Update 2026-09-12: Cache-Busting und Nginx no-cache Fix
    pull_policy: always
    container_name: erkw
    restart: unless-stopped
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/erkw/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
