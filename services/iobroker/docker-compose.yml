services:
  iobroker:
    image: buanet/iobroker:latest
    container_name: iobroker
    restart: unless-stopped
    ports:
      - "127.0.0.1:46:8081"
    environment:
      IOB_ADMINPORT: 8081
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/iobroker:/opt/iobroker
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "/opt/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
