services:
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: authentik-server
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:2884:9000"
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_WEB__BASE_URL: "https://auth.orfel.de"
      AUTHENTIK_MIGRATIONS__DANGEROUSLY_ALLOW_MULTIPLE_MAJOR_VERSION_UPGRADES: "true"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/authentik/data:/data
      - /mnt/Jannik-Cloud-Volume-01/authentik/media:/media
      - /mnt/Jannik-Cloud-Volume-01/authentik/templates:/templates
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - jannik-cloud-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_WEB__BASE_URL: "https://auth.orfel.de"
      AUTHENTIK_MIGRATIONS__DANGEROUSLY_ALLOW_MULTIPLE_MAJOR_VERSION_UPGRADES: "true"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/authentik/data:/data
      - /mnt/Jannik-Cloud-Volume-01/authentik/media:/media
      - /mnt/Jannik-Cloud-Volume-01/authentik/templates:/templates
      - /mnt/Jannik-Cloud-Volume-01/authentik/certs:/certs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
