services:
  viz:
    image: git.orfel.de/jannik/viz:latest
    container_name: viz
    restart: unless-stopped
    ports:
      - "127.0.0.1:849:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/viz:/data
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
