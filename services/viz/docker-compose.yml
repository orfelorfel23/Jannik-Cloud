services:
  viz:
    image: git.orfel.de/jannik/viz:latest
    container_name: viz
    restart: unless-stopped
    ports:
      - "127.0.0.1:849:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/viz:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
