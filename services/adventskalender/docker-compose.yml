services:
  adventskalender:
    image: git.orfel.de/jannik/adventskalender:latest
    container_name: adventskalender
    restart: unless-stopped
    ports:
      - "127.0.0.1:238:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DOORS_OVERRIDE_DIR: /app/content-override
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/adventskalender:/app/content-override:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
