services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindomat-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8181:8181"
    environment:
      MINDOMAT_VAULT_PATH: /vault
      QMD_CACHE_DIR: /data
      NODE_ENV: production
      # Notes-API Auth (aus .env)
      NOTES_API_TOKEN: ${NOTES_API_TOKEN:-}
      NOTES_API_ALLOWED_ORIGINS: ${NOTES_API_ALLOWED_ORIGINS:-}
    volumes:
      # Vault (Notizen, Wiki, Konfig, Logs)
      - /mnt/Jannik-Cloud-Volume-01/mindomat-vault:/vault
      # QMD-Cache (Embeddings, Model-Cache)
      - /mnt/Jannik-Cloud-Volume-01/mindomat-qmd:/data
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
