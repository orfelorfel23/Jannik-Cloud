services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/caddy/data:/data
      - /mnt/Jannik-Cloud-Volume-01/caddy/config:/config
      - /mnt/Jannik-Cloud-Volume-01/caddy/fragments:/etc/caddy/fragments
      - ./Caddyfile:/etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      jannik-cloud-net:
        aliases:
          - vpn.orfel.de

networks:
  jannik-cloud-net:
    external: true
