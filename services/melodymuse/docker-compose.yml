services:
  melodymuse:
    image: git.orfel.de/jannik/melodymuse:latest
    container_name: melodymuse
    restart: unless-stopped
    ports:
      - "127.0.0.1:6873:6873"
    environment:
      PORT: 6873
      LLM_ENDPOINT: ${LLM_ENDPOINT}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M3}
      VIDEO_AI_LINKS: ${VIDEO_AI_LINKS:-}
      DATA_DIR: /data
    volumes:
      - /mnt/Jannik-Cloud-Volume-01/melodymuse:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6873/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true
